# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: palworld
  name:
    ar: بالورلد
    en: Palworld
  description:
    ar: سيرفر بالورلد — عالم مفتوح، اصطياد Pals، بناء قواعد، وغارات مع أصدقائك. حتى 32 لاعب في نفس العالم.
    en: Palworld dedicated servers — open-world survival, Pal catching, base building and raids with your friends. Up to 32 players in one world.
  tagline:
    ar: اصطد، ابنِ، وقاتل مع أصدقائك — سيرفرك جاهز خلال دقيقة
    en: Catch, build and fight with your friends — your server, ready in a minute
  category: survival
  logo: assets/logo.webp
  banner: assets/banner.webp

resources:
  minMemoryMb: 8192
  recommendedMemoryMb: 16384
  minDiskMb: 20480
  playersPerMemoryGb: 2
  maxRecommendedPlayers: 32

container:
  image: serverkgg/palworld
  ports:
    - key: game
      containerPort: 8211
      protocol: udp
      name:
        ar: بالورلد
        en: Palworld
      hint:
        ar: في بالورلد اختر "دخول مباشر" واكتب العنوان والمنفذ مع بعض زي ما هو.
        en: In Palworld choose "Direct Connect" and type the address and port together, exactly as shown.
      hostRange:
        default: 8211
        min: 8211
        max: 8310

backup:
  only:
    - Pal/Saved/**
    - Pal/Content/Paks/~mods/**
  except:
    - Pal/Saved/**/backup/**
    - Pal/Saved/Logs/**
    - Pal/Saved/Crashes/**

reset:
  keep:
    - .steamcmd
    - .steam
    - Steam
    - steamapps
    - linux64
    - "*.so"
    - Manifest_*.txt
    - DefaultPalWorldSettings.ini
    - PalServer.sh
    - Engine
    - Pal/Binaries
    - Pal/Plugins
    - Pal/Content/Paks/Pal-*

presence:
  name: player
  id: userId
  fields:
    - key: level
      label:
        ar: المستوى
        en: Level
    - key: ping
      label:
        ar: البنق
        en: Ping

files:
  protected:
    - .steamcmd
    - .steam
    - Steam
    - steamapps
    - linux64
    - "*.so"
    - PalServer.sh
    - Engine
    - Pal/Binaries
    - Pal/Plugins
    - Pal/Content/Paks/Pal-*
    - .serverk-install.json
  notable:
    - match: Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
      label:
        ar: إعدادات
        en: Settings
      icon: settings
      color: "#5ba32b"
      restart: true
      note:
        ar: إعدادات السيرفر كاملة — الاسم، كلمة المرور، عدد اللاعبين، ومعدلات اللعب. أي تعديل يبي إعادة تشغيل.
        en: Every server setting — name, password, player slots and the game rates. Any change needs a restart.
    - match: Pal/Saved/SaveGames
      label:
        ar: بيانات العالم
        en: World data
      icon: map
      color: "#4a8fd4"
      note:
        ar: عالمك وشخصيات اللاعبين. لا تعدّل عليه والسيرفر شغّال، وخذ نسخة احتياطية قبل أي شي.
        en: Your world and the player characters. Do not touch it while the server runs, and take a backup first.
    - match: Pal/Content/Paks/~mods
      label:
        ar: المودات
        en: Mods
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: مجلد المودات. حط ملفات pak هنا وأعد التشغيل عشان تشتغل، ولازم كل اللاعبين يكون عندهم نفس المودات.
        en: Your mods folder. Drop pak files here and restart for them to load — every player needs the same mods.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: أنشئ سيرفر بالورلد وادخله مع أصدقائك خلال دقائق.
      en: Create your Palworld server and join it with friends within minutes.
    tags:
      - start
    surfaces:
      - overview
      - setup
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
