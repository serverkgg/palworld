# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: palworld
  name:
    ar: بالورلد
    en: Palworld
  description:
    ar: سيرفر بالورلد للبقاء في ماب مفتوحة، مع اصطياد Pals، وبناء القواعد، والغارات مع أصحابك. حتى 32 لاعبًا في الماب نفسها.
    en: Palworld dedicated servers for open-world survival, Pal catching, base building and raids with your friends. Up to 32 players in one world.
  tagline:
    ar: اصطد وابنِ وقاتل مع أصحابك، وسيرفرك جاهز خلال دقيقة
    en: Catch, build and fight with your friends, on a server ready in a minute
  category: survival
  logo: assets/logo.webp
  banner: assets/banner.webp
  extensions:
    - kind: mods
      sources: []

resources:
  minMemoryMb: 8192
  recommendedMemoryMb: 16384
  minDiskMb: 20480
  playersPerMemoryGb: 2
  maxRecommendedPlayers: 32

container:
  image: serverkgg/palworld
  runtime:
    platform: linux
    installBudgetMinutes: 20
    bootBudgetMinutes: 12
    shmMb: 64
    pidsLimit: 512
  ports:
    - key: game
      containerPort: 8211
      protocol: udp
      mirror: true
      name:
        ar: بالورلد
        en: Palworld
      hint:
        ar: في بالورلد اختر «دخول مباشر»، واكتب العنوان والمنفذ معًا كما يظهران.
        en: In Palworld choose "Direct Connect" and type the address and port together, exactly as shown.
      hostRange:
        default: 8211
        min: 8211
        max: 8310
    - key: rcon
      containerPort: 25575
      protocol: tcp
      name:
        ar: RCON
        en: RCON
      hint:
        ar: للأدوات الخارجية فقط، ولا يدخل منه اللاعبون. يتفعّل عند تشغيل الوصول عن بُعد من اللوحة.
        en: For external tools only, never for players. It works once remote access is turned on in the panel.
      join: separate
      hostRange:
        default: 12500
        min: 12500
        max: 12599
      activeWhen:
        - variable: RCON_EXPOSED
          values:
            - "true"

backup:
  only:
    - Pal/Saved/**
    - Pal/Content/Paks/~mods/**
  except:
    - Pal/Saved/**/backup/**
    - Pal/Saved/Logs/**
    - Pal/Saved/Crashes/**

secrets:
  - key: STEAM_WEB_API_KEY
    description:
      ar: مفتاح Steam Web API الخاص بالمنصة، ونجلب به أسماء حسابات Steam وصورها في جدولي اللاعبين والمحظورين.
      en: The platform's Steam Web API key. It reads Steam account names and avatars for the players and banned lists.
    required: false

reset:
  keep:
    - .steamcmd
    - .steam
    - Steam
    - steamapps
    - linux64
    - steamclient.so
    - libsteamwebrtc.so
    - Manifest_*.txt
    - DefaultPalWorldSettings.ini
    - PalServer.sh
    - Engine
    - Pal/Binaries
    - Pal/Plugins
    - Pal/Content/Paks/Pal-*

presence:
  name: player
  id: userId
  avatar: "https://avatars.steamstatic.com/{avatarHash}_full.jpg"
  fields:
    - key: account
      label:
        ar: الحساب
        en: Account
    - key: platform
      label:
        ar: المنصة
        en: Platform
    - key: level
      label:
        ar: المستوى
        en: Level
    - key: ping
      label:
        ar: البنق
        en: Ping

files:
  protected:
    - .serverk-install.json
  notable:
    - match: Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
      label:
        ar: إعدادات
        en: Settings
      icon: settings
      color: "#5ba32b"
      restart: true
      note:
        ar: إعدادات السيرفر كاملة، من الاسم وكلمة المرور إلى عدد اللاعبين ومعدلات اللعب. يُطبَّق أي تعديل بعد الريستارت.
        en: Every server setting, from the name and password to player slots and the game rates. Any change needs a restart.
    - match: Pal/Saved/SaveGames
      label:
        ar: بيانات الماب
        en: World data
      icon: map
      color: "#4a8fd4"
      note:
        ar: مابك وشخصيات اللاعبين. لا تعدّل عليها والسيرفر شغّال، وخذ نسخة احتياطية قبل أي تعديل.
        en: Your world and the player characters. Don't touch it while the server runs, and take a backup first.
    - match: Pal/Saved/SaveGames/banlist.txt
      label:
        ar: المحظورون
        en: Banned
      icon: shield
      color: "#d64545"
      note:
        ar: قائمة المحظورين من سيرفرك، سطر لكل معرّف لاعب. تدير اللوحة الحظر وفكه من تبويب اللاعبين، وهذا الملف نسخة اللعبة من القائمة.
        en: The ban list for your server, one player id per line. The panel bans and unbans players from the Players tab; this file is the game's own copy.
    - match: Pal/Content/Paks/~mods
      label:
        ar: المودات
        en: Mods
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: مجلد المودات. ضع ملفات pak هنا، وتشتغل بعد الريستارت، ويلزم أن تكون المودات نفسها عند كل اللاعبين.
        en: Your mods folder. Drop pak files here and restart to load them. Every player needs the same mods.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: أنشئ سيرفر بالورلد وادخله مع أصحابك خلال دقائق.
      en: Create your Palworld server and join it with your friends within minutes.
    tags:
      - start
    surfaces:
      - overview
      - setup
      - backups
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
