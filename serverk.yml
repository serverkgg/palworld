# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: palworld
  name:
    ar: بالورلد
    en: Palworld
  description:
    ar: سيرفر بالورلد — عالم مفتوح، اصطياد Pals، بناء قواعد، وغارات مع أصدقائك. حتى 32 لاعب في نفس العالم.
    en: Palworld dedicated servers — open-world survival, Pal catching, base building and raids with your friends. Up to 32 players in one world.
  tagline:
    ar: اصطد، ابنِ، وقاتل مع أصدقائك — سيرفرك جاهز خلال دقيقة
    en: Catch, build and fight with your friends — your server, ready in a minute
  category: survival
  logo: assets/logo.webp
  banner: assets/banner.webp

resources:
  minMemoryMb: 8192
  recommendedMemoryMb: 16384
  minDiskMb: 20480
  playersPerMemoryGb: 2
  maxRecommendedPlayers: 32

container:
  image: serverkgg/palworld
  runtime:
    platform: linux
    installBudgetMinutes: 20
    bootBudgetMinutes: 12
    shmMb: 64
    pidsLimit: 512
  ports:
    - key: game
      containerPort: 8211
      protocol: udp
      mirror: true
      name:
        ar: بالورلد
        en: Palworld
      hint:
        ar: في بالورلد اختر "دخول مباشر" واكتب العنوان والمنفذ مع بعض زي ما هو.
        en: In Palworld choose "Direct Connect" and type the address and port together, exactly as shown.
      hostRange:
        default: 8211
        min: 8211
        max: 8310
    - key: rcon
      containerPort: 25575
      protocol: tcp
      name:
        ar: RCON
        en: RCON
      hint:
        ar: للأدوات الخارجية بس، ما يدخل منه لاعب. يشتغل لما تفتح الوصول عن بُعد من اللوحة.
        en: For external tools only, never for players. Live once remote access is turned on in the panel.
      join: separate
      hostRange:
        default: 12500
        min: 12500
        max: 12599
      activeWhen:
        - variable: RCON_EXPOSED
          values:
            - "true"

backup:
  only:
    - Pal/Saved/**
    - Pal/Content/Paks/~mods/**
    - Mods/**
  except:
    - Pal/Saved/**/backup/**
    - Pal/Saved/Logs/**
    - Pal/Saved/Crashes/**

secrets:
  - key: STEAM_WEB_API_KEY
    description:
      ar: مفتاح Steam Web API للمنصة — منه نجيب أسماء حسابات Steam وصورهم في جدول اللاعبين والمحظورين.
      en: The platform's Steam Web API key — it reads Steam account names and avatars for the players and banned lists.
    required: false

reset:
  keep:
    - .steamcmd
    - .steam
    - Steam
    - steamapps
    - linux64
    - steamclient.so
    - libsteamwebrtc.so
    - Manifest_*.txt
    - DefaultPalWorldSettings.ini
    - PalServer.sh
    - Engine
    - Pal/Binaries
    - Pal/Plugins
    - Pal/Content/Paks/Pal-*

presence:
  name: player
  id: userId
  avatar: "https://avatars.steamstatic.com/{avatarHash}_full.jpg"
  fields:
    - key: account
      label:
        ar: الحساب
        en: Account
    - key: platform
      label:
        ar: المنصة
        en: Platform
    - key: level
      label:
        ar: المستوى
        en: Level
    - key: ping
      label:
        ar: البنق
        en: Ping

files:
  protected:
    - .steamcmd
    - .steam
    - Steam
    - steamapps
    - linux64
    - steamclient.so
    - libsteamwebrtc.so
    - PalServer.sh
    - Engine
    - Pal/Binaries
    - Pal/Plugins
    - Pal/Content/Paks/Pal-*
    - .serverk-install.json
    - libUE4SS.so
    - UE4SS-settings.ini
    - MemberVariableLayout.ini
    - .serverk-ue4ss.json
  notable:
    - match: Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
      label:
        ar: إعدادات
        en: Settings
      icon: settings
      color: "#5ba32b"
      restart: true
      note:
        ar: إعدادات السيرفر كاملة — الاسم، كلمة المرور، عدد اللاعبين، ومعدلات اللعب. أي تعديل يبي إعادة تشغيل.
        en: Every server setting — name, password, player slots and the game rates. Any change needs a restart.
    - match: Pal/Saved/SaveGames
      label:
        ar: بيانات العالم
        en: World data
      icon: map
      color: "#4a8fd4"
      note:
        ar: عالمك وشخصيات اللاعبين. لا تعدّل عليه والسيرفر شغّال، وخذ نسخة احتياطية قبل أي شي.
        en: Your world and the player characters. Do not touch it while the server runs, and take a backup first.
    - match: Pal/Saved/SaveGames/banlist.txt
      label:
        ar: محظورين
        en: Banned
      icon: shield
      color: "#d64545"
      note:
        ar: قائمة المحظورين من سيرفرك، سطر لكل معرّف لاعب. اللوحة تدير الحظر ورفعه من تبويب اللاعبين، وهذا الملف نسخة اللعبة منها.
        en: The ban list for your server, one player id per line. The panel adds and lifts bans from the Players tab; this file is the game's own copy.
    - match: Pal/Content/Paks/~mods
      label:
        ar: المودات
        en: Mods
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: مجلد المودات. حط ملفات pak هنا وأعد التشغيل عشان تشتغل، ولازم كل اللاعبين يكون عندهم نفس المودات.
        en: Your mods folder. Drop pak files here and restart for them to load — every player needs the same mods.
    - match: Mods
      label:
        ar: مودات UE4SS
        en: UE4SS mods
      icon: puzzle
      color: "#c77dff"
      restart: true
      note:
        ar: مودات لوا اللي تشتغل على UE4SS. كل مود مجلد فيه scripts/main.lua، وتشغّله من سطره في Mods/mods.txt.
        en: The Lua mods UE4SS runs. Each mod is a folder with scripts/main.lua inside it, switched on from its line in Mods/mods.txt.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: أنشئ سيرفر بالورلد وادخله مع أصدقائك خلال دقائق.
      en: Create your Palworld server and join it with friends within minutes.
    tags:
      - start
    surfaces:
      - overview
      - setup
      - backups
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
